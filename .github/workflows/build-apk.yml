name: Build JARVIS MAX 6.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 2 -type f -print

      - name: Unpack JARVIS 6.1 package
        run: |
          echo "Using JARVIS MAX 6.1 package..."

          if [ ! -f "JARVIS_GITHUB_PHONE_PACKAGE_6_1.zip" ]; then
            echo "ERROR: JARVIS_GITHUB_PHONE_PACKAGE_6_1.zip not found in repository root."
            echo "Files currently in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          unzip -q "JARVIS_GITHUB_PHONE_PACKAGE_6_1.zip" -d jarvis_package

      - name: Find and unpack Android source
        run: |
          echo "Looking for Android source..."

          SOURCE=$(find jarvis_package -type f -name "source.zip" | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: source.zip not found."
            echo "Contents of package:"
            find jarvis_package -type f -print
            exit 1
          fi

          echo "Found source: $SOURCE"

          unzip -q "$SOURCE" -d buildsrc

          echo "Extracted project:"
          find buildsrc -maxdepth 3 -type f -print

      - name: Locate Android project
        run: |
          PROJECT=$(find buildsrc -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find buildsrc -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Android project found at: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build JARVIS MAX 6.1
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building JARVIS MAX 6.1..."
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload JARVIS MAX 6.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-MAX-6.1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
