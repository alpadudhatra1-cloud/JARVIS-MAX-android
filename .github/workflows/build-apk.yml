name: Build JARVIS MAX 6.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 2 -type f -print

      - name: Unpack JARVIS 6.1 package
        run: |
          echo "Using JARVIS MAX 6.1 package..."
          unzip -q JARVIS_GITHUB_PHONE_PACKAGE_6_1.zip -d jarvis_package

      - name: Find and unpack Android source
       run: |
       SOURCE=$(find jarvis_package -type f -name 'source.zip' | head -n 1)

    if [ -z "$SOURCE" ]; then
      echo "ERROR: source.zip not found."
      find jarvis_package -type f -print
      exit 1
    fi

    echo "Found source: $SOURCE"
    unzip -q "$SOURCE" -d buildsrc

          echo "Extracted project:"
          find buildsrc -maxdepth 3 -type f -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build JARVIS MAX 6.1
        path: buildsrc/JARVIS_MAX_ANDROID_6_1/app/build/outputs/apk/debug/app-debug.apk
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload JARVIS 6.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-MAX-6.1-APK
          path: buildsrc/JARVIS_MAX_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
