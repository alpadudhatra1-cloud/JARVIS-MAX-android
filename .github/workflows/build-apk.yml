- name: Find and unpack JARVIS project
  run: |
    echo "Files in repository:"
    find . -maxdepth 2 -type f -print
    ZIP=$(find . -maxdepth 2 -type f -iname '*JARVIS*ANDROID*SOURCE*.zip' | head -n 1)

    if [ -z "$ZIP" ]; then
      echo "ERROR: JARVIS Android source ZIP was not found."
      exit 1
    fi

    echo "Found: $ZIP"
    unzip -q "$ZIP" -d buildsrc
    echo "PROJECT_DIR=$GITHUB_WORKSPACE/buildsrc/JARVIS_MAX_ANDROID" >> "$GITHUB_ENV"
    
          
